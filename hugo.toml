baseURL = 'https://puke.eu.org/'
title = '普客网'
theme = 'PaperMod'
defaultContentLanguage = 'zh-cn'

[languages]
  [languages.zh-cn]
    label = '中文'
    locale = 'zh-CN'
    title = '普客网'
    weight = 1

enableRobotsTXT = true
enableEmoji = false
summaryLength = 80

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = '普客网，Yet Bai 的个人小站。记录技术折腾与日常。'
  author = 'tobaye'
  defaultTheme = 'auto'
  DateFormat = '2006年1月2日'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowPageNums = true
  ShowToc = false
  disableThemeToggle = false

  [params.homeInfoParams]
    Title = '欢迎来到普客网'
    Content = '这里是 Yet Bai 的个人小站，写写技术折腾、工具和日常。'

  [params.label]
    text = '普客网'
    icon = '/images/logo.webp'
    iconHeight = 32

  [params.assets]
    favicon = '/images/logo.webp'
    favicon16x16 = '/images/logo.webp'
    favicon32x32 = '/images/logo.webp'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 20

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ['HTML', 'RSS']
