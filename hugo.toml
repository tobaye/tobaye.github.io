baseURL = 'https://puke.eu.org/'
title = '普客网'
theme = 'PaperMod'
defaultContentLanguage = 'zh-cn'
timeZone = 'Asia/Shanghai'

[languages]
  [languages.zh-cn]
    label = '中文'
    locale = 'zh-CN'
    title = '普客网'
    weight = 1

enableRobotsTXT = true
enableEmoji = false
summaryLength = 80

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = '普客网，Yet Bai 的个人小站。记录技术折腾与日常。'
  author = 'tobaye'
  defaultTheme = 'auto'
  DateFormat = '2006年1月2日'
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowPageNums = true
  ShowToc = true
  disableThemeToggle = false

  [params.footer]
    text = '普客网 · 记录技术折腾与日常'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/tobaye'
  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'

  [params.homeInfoParams]
    Title = '欢迎来到普客网'
    Content = '这里是 Yet Bai 的个人小站，写写技术折腾、工具和日常。'

  [params.label]
    text = '普客网'
    icon = '/images/logo.webp'
    iconHeight = 32

  [params.assets]
    favicon = '/images/logo.webp'
    favicon16x16 = '/images/logo.webp'
    favicon32x32 = '/images/logo.webp'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 5
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 15
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 30
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 40
  [[menu.main]]
    identifier = 'admin'
    name = '后台'
    url = '/admin/'
    weight = 50

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']
