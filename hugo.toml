baseURL = 'https://puke.eu.org/'
title = '普客网'
theme = 'tobpage'
defaultContentLanguage = 'zh-cn'
timeZone = 'Asia/Shanghai'

[languages]
  [languages.zh-cn]
    label = '中文'
    locale = 'zh-CN'
    title = '普客网'
    weight = 1

enableRobotsTXT = true
enableEmoji = false
summaryLength = 80

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = '普客网，Yet Bai 的个人小站。记录技术折腾与日常。'
  author = 'tobaye'
  defaultTheme = 'auto'
  DateFormat = '2006年1月2日'
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowPageNums = true
  ShowToc = true
  disableThemeToggle = false

  [params.footer]
    text = '普客网 · 记录技术折腾与日常'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/tobaye'
  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'
  [[params.socialIcons]]
    name = 'mail'
    url = 'mailto:tobaye@outlook.sg'

  [params.homeInfoParams]
    Title = '欢迎来到普客网'
    Content = '这里是我的个人小站，写写技术折腾、工具和日常。'

  [params.label]
    text = '普客网'
    icon = '/images/logo.webp'
    iconHeight = 32

  [params.assets]
    favicon = '/images/logo.webp'
    favicon16x16 = '/images/logo.webp'
    favicon32x32 = '/images/logo.webp'

  [params.tobpage]
    heroMotto = '普天之下，皆为客。'
    titleImage = 'img/hero-title.webp'
    startDate = '2026-10-29'
    moeIcp = '萌ICP备20269123号'
    moeIcpURL = 'https://icp.gov.moe/?keyword=20269123'
    # 访问统计（Cloudflare Web Analytics，站点层功能）：在 CF 控制台 Web Analytics 添加 puke.eu.org 拿到令牌后，
    # 取消下一行注释并填入令牌即生效（经 layouts/partials/site-beacon.html 输出，主题无关）
    cfBeaconToken = '1198ae69400a4cf6941f8c6d9a3d50c8'
    # 评论（Giscus，站点层功能）：仓库 ID 与分类 ID 已备齐；把 giscus 应用装到本仓后将 enable 改为 true 即生效（经 layouts/partials/site-comments.html 输出，主题无关）
    [params.tobpage.giscus]
      enable = false
      repo = 'tobaye/tobaye.github.io'
      repoId = 'R_kgDOVaRaiQ'
      category = 'Announcements'
      categoryId = 'DIC_kwDOVaRaic4DK9dv'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 5
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 15
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 30
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 40

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']
