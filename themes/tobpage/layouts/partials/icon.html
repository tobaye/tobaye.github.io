{{- /* 图标引用：{{ partial "icon.html" (dict "name" "home" "size" 16 "color" "#c9a24b" "class" "x") }}
     name 对应 icon-sprite.html 里的 symbol（#i-<name>）；color 直接给 svg 上色（描边走 currentColor）。 */ -}}
{{- $s := .size | default 18 -}}
<svg class="ic{{ with .class }} {{ . }}{{ end }}" width="{{ $s }}" height="{{ $s }}" aria-hidden="true" focusable="false"{{ with .color }} style="color: {{ . }}"{{ end }}><use href="#i-{{ .name }}"></use></svg>
